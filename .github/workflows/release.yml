name: Build native Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build native x86 executable
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 2
          call "%VSROOT%\VC\Auxiliary\Build\vcvars32.bat"
          if not exist build mkdir build
          cl /nologo /std:c++17 /O2 /MT /EHsc /DUNICODE /D_UNICODE /Fe:build\KeyRemapper.exe src\main.cpp user32.lib comctl32.lib shell32.lib advapi32.lib

      - name: Native hook smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\KeyRemapper.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Hook self-test failed with exit code $($p.ExitCode)" }

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "\${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: '& "\${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\KeyRemapper.iss"'

      - uses: actions/upload-artifact@v4
        with:
          name: KeyRemapper-Native-Setup
          path: dist/KeyRemapper_Setup.exe
          if-no-files-found: error

      - name: Publish v1.1.0
        shell: pwsh
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.1.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.1.0 "dist/KeyRemapper_Setup.exe" --title "Key Remapper Native Rebuild v1.1.0" --notes "Native x86 Win32 rebuild. No bundled .NET runtime. Includes keyboard/mouse low-level hook smoke test in CI."
          } else {
            gh release upload v1.1.0 "dist/KeyRemapper_Setup.exe" --clobber
          }
