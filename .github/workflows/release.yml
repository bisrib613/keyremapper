name: Build and release Key Remapper

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyremapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = "v" + ((Select-String -Path "installer/KeyRemapper.iss" -Pattern '#define AppVersion "([^"]+)"').Matches.Groups[1].Value)
          if ($tag -ne $expected) { throw "Tag $tag does not match installer version $expected" }

      - name: Build production and isolated test executables
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 2
          call "%VSROOT%\VC\Auxiliary\Build\vcvars32.bat"
          if not exist build mkdir build
          rc /nologo /fo build\resource.res src\resource.rc
          cl /nologo /std:c++17 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE /Fe:build\KeyRemapper.exe src\main.cpp build\resource.res user32.lib gdi32.lib comctl32.lib shell32.lib /link /DYNAMICBASE /NXCOMPAT /GUARD:CF
          cl /nologo /std:c++17 /O2 /MT /EHsc /W4 /DKRM_TEST_BUILD /DUNICODE /D_UNICODE /Fe:build\KeyRemapperTests.exe src\main.cpp build\resource.res user32.lib gdi32.lib comctl32.lib shell32.lib /link /DYNAMICBASE /NXCOMPAT /GUARD:CF

      - name: Run isolated regression suite
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\build\KeyRemapperTests.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Regression suite failed with exit code $($p.ExitCode)" }
          $productionText = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes(".\build\KeyRemapper.exe"))
          if ($productionText.Contains("--self-test")) {
            throw "Production binary unexpectedly contains the self-test switch"
          }

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.1 --yes --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\KeyRemapper.iss"'

      - uses: actions/upload-artifact@v4
        with:
          name: KeyRemapper-Native-Setup
          path: dist/KeyRemapper_Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KeyRemapper-Native-Setup
          path: dist
      - name: Create immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/KeyRemapper_Setup.exe" \
            --repo "${{ github.repository }}" \
            --title "Key Remapper ${{ github.ref_name }}" \
            --notes "Native Win32 stability release. Built and tested from the exact tagged commit."
